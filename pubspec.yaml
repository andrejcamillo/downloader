name: downloader
description: Um aplicativo Flutter para baixar músicas e vídeos do YouTube e Spotify.
publish_to: 'none' # Impede a publicação para pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  shared_preferences: ^2.2.3
  file_picker: ^8.0.0 # Adicionada para seleção de arquivos
  path_provider: ^2.1.3 # Adicione esta linha ou atualize a versão
  image_picker: ^1.0.8 # <<<<< CERTIFIQUE-SE QUE ESTA LINHA ESTÁ AQUI
  process_run: ^1.0.1 # <<<<< VERSÃO ATUALIZADA PARA NULL SAFETY
  path: ^1.8.3 # Adicione ou confirme que esta linha existe
  window_size: ^0.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/fundo.png
    - assets/fonts/  # <-- ADICIONE ESTA LINHA

  fonts:
    - family: Comic Sans MS
      fonts:
        - asset: assets/fonts/comic.ttf
        - asset: assets/fonts/COMICBD.ttf
          weight: 700